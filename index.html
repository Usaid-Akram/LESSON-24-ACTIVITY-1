<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays In Javascript</title>
</head>
<body>
    <h2>Arrays In Javascript</h2>
    <p id="empty-p"></p>
    <script>
        let arr = [1, 2, 3, 4, 5];
        document.getElementById("empty-p").innerHTML = arr[2];
        let length = arr.length;
        document.getElementById("empty-p").innerHTML += "<br>Length of the array is: " + length;

    </script>
</body>
</html>
